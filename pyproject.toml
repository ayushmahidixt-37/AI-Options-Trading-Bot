[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-options-trading-bot"
version = "0.1.0"
description = "Server-ready, paper-first options trading bot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "logzero>=1.7,<2",
    "python-multipart>=0.0.9,<1",
    "pyotp>=2.9,<3",
    "smartapi-python>=1.5.5,<2",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.30,<1",
    "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "pytest>=8,<10",
    "ruff>=0.8,<0.16",
]

[project.scripts]
options-bot = "options_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
options_bot = ["templates/*.html", "templates/partials/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
